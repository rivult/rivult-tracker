# Builds the released zip in public CI, from public source, and signs it with
# a provenance attestation.
#
# This is the point of the workflow: "the source is open" does not prove the
# BINARY matches it, and the binary is what people run. An attestation lets
# anyone verify the zip they downloaded was produced by this workflow from a
# specific commit, without reading a line of the code:
#
#     gh attestation verify RivultTracker-vX.Y.Z.zip --repo rivult/rivult-tracker
#
# Triggered by pushing a tag, e.g.  git tag v0.12.0 && git push origin v0.12.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npx vitest run
          npm run build

      # Pinned to the interpreter the releases are built against. A different
      # minor version changes which stdlib extensions PyInstaller bundles, so
      # this is not cosmetic.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest tests/ -q

      # The spec hard-fails without frontend/dist, which is deliberate - it
      # makes "shipped a stale UI" impossible rather than merely unlikely.
      - name: Package
        run: python -m PyInstaller --noconfirm --clean RivultTracker.spec

      # v0.12.0 shipped without pywebview: it built, ran, served the dashboard
      # and passed every test, but opened a browser tab instead of the native
      # window. Nothing in the pipeline noticed. This is what notices.
      - name: Verify the bundle isn't missing anything silent
        run: python tools/verify_bundle.py dist/RivultTracker

      - name: Verify the version resource matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $exe = (Get-Item "dist\RivultTracker\RivultTracker.exe").VersionInfo.ProductVersion
          "tag=$tag  exe=$exe"
          if ($exe -ne $tag) { throw "version_info.txt says $exe but the tag says $tag" }

      - name: Stage and zip
        shell: pwsh
        run: |
          Copy-Item release\README-FIRST.txt dist\RivultTracker\   # fail loudly if missing
          Compress-Archive -Path dist\RivultTracker `
            -DestinationPath "RivultTracker-${{ github.ref_name }}.zip" -CompressionLevel Optimal

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: RivultTracker-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: RivultTracker-${{ github.ref_name }}.zip
          generate_release_notes: true
